name: keepalive

# Supabase 무료 프로젝트는 7일간 활동이 낮으면 일시정지된다. 매일 바깥에서 요청을 한 번 넣어 막는다.
# 덤으로 저장소에도 커밋을 남긴다. 공개 저장소의 예약 작업은 60일간 새 커밋이 없으면 자동으로 꺼지는데,
# 그 시점이 하필 프로젝트를 한동안 손대지 않을 때, 즉 이 작업이 가장 필요한 때다.

on:
  schedule:
    # 매일 UTC 03:17 = 한국 시간 낮 12시 17분. 정시를 피해 실행 지연 가능성을 줄인다.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 핑
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          ANON: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          res=$(curl -sS -w '\n%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" \
            -d '{}')
          code=$(printf '%s' "$res" | tail -n1)
          body=$(printf '%s' "$res" | sed '$d')
          # 응답은 갱신된 시각뿐이라 비밀 값이 아니다. 그대로 남겨 둬야 나중에 원인을 찾을 수 있다.
          echo "HTTP $code / 응답: $body"
          if [ "$code" != "200" ]; then
            echo "::error::ping 이 200 이 아니다. Supabase 가 일시정지됐거나 함수·권한이 빠졌을 수 있다."
            exit 1
          fi
          if ! printf '%s' "$body" | grep -qE '[0-9]{4}-[0-9]{2}-[0-9]{2}T'; then
            echo "::error::응답에 시각이 없다. ping() 이 갱신한 값을 돌려주지 않았다."
            exit 1
          fi

      # 아래 두 단계는 저장소 활동용이라, 실패해도 핑은 이미 성공했으므로 작업 전체를 실패시키지 않는다.
      - uses: actions/checkout@v7
        continue-on-error: true

      - name: keepalive 브랜치에 표식 남기기
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # main 이력을 더럽히지 않게 별도 브랜치에 둔다. 배포 워크플로는 main 푸시만 보므로 다시 돌지 않는다.
          # 매번 고아 커밋 하나로 덮어써 이력이 쌓이지 않는다.
          git checkout --orphan keepalive
          git reset
          date -u +'%Y-%m-%dT%H:%M:%SZ' > keepalive.txt
          git add keepalive.txt
          git commit -m "chore: keepalive 표식 갱신"
          git push -f origin keepalive
