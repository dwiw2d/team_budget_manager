server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 기본 mime.types 에 webmanifest 가 없어 추가한다.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Supabase 출처는 여기에 박을 수 없다. 클라우드는 https://<ref>.supabase.co 지만 자체 호스팅은
    # http://<host>:8000 이라 이미지가 어디로 배포될지 모르기 때문이다. 정확한 한 출처는 index.html 의
    # meta CSP 가 빌드 때 주입받아 좁히고, 브라우저는 두 정책을 모두 적용하므로 실제 허용 범위는 그 한 곳이다.
    # frame-ancestors 는 meta 로는 무시되므로 이 헤더에만 있다.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http: https:; font-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'";

    # 서비스워커와 manifest 는 항상 새로 받아야 자동 업데이트가 된다.
    # nginx 는 하위 블록에 add_header 가 하나라도 있으면 상위 add_header 를 전혀 물려주지 않는다.
    # 그래서 이 블록은 Cache-Control 과 함께 아래 location / 과 같은 보안 헤더를 다시 적는다. 한쪽만 고치지 말 것.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location / {
        # 영수증 촬영에 카메라를 쓰므로 camera 만 self 로 연다.
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
