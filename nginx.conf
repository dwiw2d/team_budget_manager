server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 기본 mime.types 에 webmanifest 가 없어 추가한다.
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # 서비스워커와 manifest 는 항상 새로 받아야 자동 업데이트가 된다.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
